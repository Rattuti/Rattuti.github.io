<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道具棚</title>
<meta name="description" content="自作アプリのランチャー兼ポータル">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#16255A">
<style>
  :root {
    --bg: #f5f3ee;
    --panel: #ffffff;
    --panel-hover: #fbfaf7;
    --text: #1c1d21;
    --muted: #6b6b70;
    --border: #e4dfd2;
    --accent: #16255A;
    --accent-fg: #ffffff;
    --highlight: #b9840f;
    --highlight-bg: #f4e6c4;
    --shadow: 0 1px 2px rgba(22,37,90,0.06), 0 1px 1px rgba(22,37,90,0.04);
    --focus-ring: #16255A;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1220;
      --panel: #161b2c;
      --panel-hover: #1c2236;
      --text: #eae6da;
      --muted: #9aa0b4;
      --border: #262c42;
      --accent: #7b8bd6;
      --accent-fg: #0d1220;
      --highlight: #e8b93a;
      --highlight-bg: #3a2f10;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 1px 1px rgba(0,0,0,0.2);
      --focus-ring: #e8b93a;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Segoe UI", sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  header {
    padding: 2.25rem 1.5rem 1rem;
    max-width: 960px;
    margin: 0 auto;
  }
  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.9rem;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }
  header h1 .mark {
    width: 1.4rem;
    height: 1.4rem;
    border-radius: 5px;
    background: var(--accent);
    flex: none;
  }

  .search-wrap {
    position: relative;
  }
  #search {
    width: 100%;
    font-size: 1rem;
    padding: 0.7rem 0.9rem 0.7rem 2.4rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  #search:focus {
    border-color: var(--focus-ring);
  }
  .search-wrap::before {
    content: "";
    position: absolute;
    left: 0.85rem;
    top: 50%;
    width: 0.95rem;
    height: 0.95rem;
    transform: translateY(-50%);
    border: 2px solid var(--muted);
    border-radius: 50%;
    background:
      linear-gradient(var(--muted), var(--muted)) no-repeat;
    background-size: 2px 0.5rem;
    pointer-events: none;
  }
  .search-hint {
    margin-top: 0.4rem;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .sync-info {
    margin-top: 0.35rem;
    font-size: 0.72rem;
    color: var(--muted);
    min-height: 1em;
  }
  kbd {
    font-family: inherit;
    font-size: 0.75rem;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 4px;
    padding: 0.05rem 0.35rem;
    background: var(--panel);
  }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 0.5rem 1.5rem 3rem;
  }

  section.group {
    margin-top: 2rem;
  }
  section.group h2 {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 0.75rem;
    padding-left: 0.1rem;
  }
  section.group[data-status="公開中"] h2 { color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 0.8rem;
  }

  .card {
    position: relative;
    display: block;
    padding: 1rem 1.1rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: transform 0.12s, background 0.12s, border-color 0.12s;
  }
  .card:hover {
    background: var(--panel-hover);
    border-color: var(--accent);
  }
  .card.selected {
    border-color: var(--highlight);
    box-shadow: 0 0 0 2px var(--highlight-bg);
  }
  .card .num {
    position: absolute;
    top: 0.6rem;
    right: 0.65rem;
    font-size: 0.7rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 0.02rem 0.35rem;
  }
  .card .name {
    font-weight: 700;
    font-size: 1rem;
    margin: 0 0 0.3rem;
    padding-right: 1.6rem;
  }
  .card .desc {
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0 0 0.6rem;
    min-height: 1.2em;
  }
  .card .category {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-radius: 999px;
    padding: 0.12rem 0.6rem;
  }
  .card .notion-hint {
    display: inline-block;
    font-size: 0.72rem;
    color: var(--muted);
    margin-left: 0.4rem;
  }
  .card-disabled {
    cursor: default;
  }
  .card-disabled:hover {
    background: var(--panel);
    border-color: var(--border);
  }

  .empty, .loading {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 2rem 0;
    text-align: center;
  }

  .fallback-note {
    margin: 0 0 1rem;
    padding: 0.6rem 0.9rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--highlight-bg);
    color: var(--text);
    font-size: 0.8rem;
  }

  footer {
    max-width: 960px;
    margin: 0 auto;
    padding: 1rem 1.5rem 2.5rem;
    color: var(--muted);
    font-size: 0.75rem;
  }
</style>
</head>
<body>
<header>
  <h1><span class="mark" aria-hidden="true"></span>道具棚</h1>
  <div class="search-wrap">
    <input id="search" type="text" placeholder="検索…" autocomplete="off" spellcheck="false">
  </div>
  <p class="search-hint">
    <kbd>/</kbd> 検索にフォーカス &nbsp;
    <kbd>1</kbd>–<kbd>9</kbd> 起動 &nbsp;
    <kbd>↑</kbd><kbd>↓</kbd> 選択 &nbsp;
    <kbd>Enter</kbd> 開く
  </p>
  <p class="sync-info" id="syncInfo"></p>
</header>
<main id="main">
  <p class="loading" id="loading">読み込み中…</p>
</main>
<footer>道具棚 — 自作アプリランチャー</footer>

<script>
(function () {
  "use strict";

  var STATUS_ORDER = ["公開中", "開発中", "構想"];
  var GH_USER = "Rattuti";
  var PORTAL_REPO = "Rattuti.github.io";

  var mainEl = document.getElementById("main");
  var searchEl = document.getElementById("search");
  var syncInfoEl = document.getElementById("syncInfo");

  var allApps = [];
  var visibleCards = []; // flattened list of {el, app} currently rendered
  var selectedIndex = -1;
  var usedFallback = false;
  var lastUpdated = "";

  function normalize(str) {
    return (str || "").toString().toLowerCase();
  }

  function matchesQuery(app, q) {
    if (!q) return true;
    q = normalize(q);
    return normalize(app.name).indexOf(q) !== -1 ||
      normalize(app.description).indexOf(q) !== -1 ||
      normalize(app.category).indexOf(q) !== -1;
  }

  function groupByStatus(apps) {
    var groups = {};
    STATUS_ORDER.forEach(function (s) { groups[s] = []; });
    apps.forEach(function (app) {
      var s = STATUS_ORDER.indexOf(app.status) !== -1 ? app.status : "その他";
      if (!groups[s]) groups[s] = [];
      groups[s].push(app);
    });
    Object.keys(groups).forEach(function (s) {
      groups[s].sort(function (a, b) {
        var oa = typeof a.order === "number" ? a.order : 999999;
        var ob = typeof b.order === "number" ? b.order : 999999;
        if (oa !== ob) return oa - ob;
        return normalize(a.name).localeCompare(normalize(b.name));
      });
    });
    return groups;
  }

  function render() {
    var q = searchEl.value.trim();
    var filtered = allApps.filter(function (app) { return matchesQuery(app, q); });
    var groups = groupByStatus(filtered);

    mainEl.innerHTML = "";
    visibleCards = [];

    if (usedFallback) {
      var note = document.createElement("p");
      note.className = "fallback-note";
      note.textContent = "apps.json を取得できなかったため、GitHub のリポジトリ一覧から簡易表示しています。";
      mainEl.appendChild(note);
    }

    var order = STATUS_ORDER.concat(Object.keys(groups).filter(function (s) {
      return STATUS_ORDER.indexOf(s) === -1;
    }));

    var anyRendered = false;
    var cardCounter = 0;

    order.forEach(function (status) {
      var list = groups[status];
      if (!list || list.length === 0) return;
      anyRendered = true;

      var section = document.createElement("section");
      section.className = "group";
      section.dataset.status = status;

      var h2 = document.createElement("h2");
      h2.textContent = status + "（" + list.length + "）";
      section.appendChild(h2);

      var grid = document.createElement("div");
      grid.className = "grid";

      list.forEach(function (app) {
        cardCounter++;
        var hasHref = !!app.href;
        var card = document.createElement(hasHref ? "a" : "div");
        card.className = "card" + (hasHref ? "" : " card-disabled");
        if (hasHref) {
          card.href = app.href;
          card.target = "_blank";
          card.rel = "noopener";
        }

        if (cardCounter <= 9) {
          var num = document.createElement("span");
          num.className = "num";
          num.textContent = String(cardCounter);
          card.appendChild(num);
        }

        var name = document.createElement("p");
        name.className = "name";
        name.textContent = app.name;
        card.appendChild(name);

        if (app.description) {
          var desc = document.createElement("p");
          desc.className = "desc";
          desc.textContent = app.description;
          card.appendChild(desc);
        }

        if (app.category) {
          var cat = document.createElement("span");
          cat.className = "category";
          cat.textContent = app.category;
          card.appendChild(cat);
        }

        if (!app.url) {
          var notionHint = document.createElement("span");
          notionHint.className = "notion-hint";
          notionHint.textContent = "Notionで確認";
          card.appendChild(notionHint);
        }

        grid.appendChild(card);
        visibleCards.push({ el: card, app: app });
      });

      section.appendChild(grid);
      mainEl.appendChild(section);
    });

    if (!anyRendered) {
      var empty = document.createElement("p");
      empty.className = "empty";
      empty.textContent = q ? "該当するアプリがありません。" : "登録されているアプリがありません。";
      mainEl.appendChild(empty);
    }

    selectedIndex = -1;
    updateSelection();
  }

  function updateSelection() {
    visibleCards.forEach(function (c, i) {
      c.el.classList.toggle("selected", i === selectedIndex);
    });
    if (selectedIndex >= 0 && visibleCards[selectedIndex]) {
      visibleCards[selectedIndex].el.scrollIntoView({ block: "nearest" });
    }
  }

  function moveSelection(delta) {
    if (visibleCards.length === 0) return;
    if (selectedIndex === -1) {
      selectedIndex = delta > 0 ? 0 : visibleCards.length - 1;
    } else {
      selectedIndex = (selectedIndex + delta + visibleCards.length) % visibleCards.length;
    }
    updateSelection();
  }

  function launch(index) {
    var entry = visibleCards[index];
    if (!entry || !entry.app.href) return;
    window.open(entry.app.href, "_blank", "noopener");
  }

  function isEditableTarget(el) {
    if (!el) return false;
    var tag = el.tagName ? el.tagName.toLowerCase() : "";
    return tag === "input" || tag === "textarea" || el.isContentEditable;
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !isEditableTarget(e.target)) {
      e.preventDefault();
      searchEl.focus();
      return;
    }
    if (e.key === "Escape" && document.activeElement === searchEl) {
      searchEl.value = "";
      render();
      searchEl.blur();
      return;
    }
    if (e.key >= "1" && e.key <= "9" && !isEditableTarget(e.target)) {
      var idx = parseInt(e.key, 10) - 1;
      if (idx < visibleCards.length) {
        e.preventDefault();
        launch(idx);
      }
      return;
    }
    if (e.key === "ArrowDown") {
      e.preventDefault();
      moveSelection(1);
      return;
    }
    if (e.key === "ArrowUp") {
      e.preventDefault();
      moveSelection(-1);
      return;
    }
    if (e.key === "Enter" && document.activeElement === searchEl) {
      if (visibleCards.length > 0) {
        e.preventDefault();
        launch(selectedIndex >= 0 ? selectedIndex : 0);
      }
      return;
    }
    if (e.key === "Enter" && selectedIndex >= 0 && !isEditableTarget(e.target)) {
      e.preventDefault();
      launch(selectedIndex);
    }
  });

  searchEl.addEventListener("input", render);

  function formatUpdated(iso) {
    var d = new Date(iso);
    if (!iso || isNaN(d.getTime())) return "";
    var fmt = new Intl.DateTimeFormat("ja-JP", {
      timeZone: "Asia/Tokyo",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit"
    });
    return fmt.format(d) + " JST";
  }

  function buildUrlFromRepo(repo) {
    if (!repo) return "";
    return "https://" + GH_USER.toLowerCase() + ".github.io/" + repo + "/";
  }

  function loadAppsJson() {
    return fetch("apps.json", { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("apps.json HTTP " + res.status);
      return res.json();
    }).then(function (data) {
      var list = Array.isArray(data) ? data : data && Array.isArray(data.apps) ? data.apps : null;
      if (!list) throw new Error("apps.json is not in the expected shape");
      if (!Array.isArray(data) && data.updated) lastUpdated = data.updated;
      return list.map(function (item) {
        var url = item.URL || item.url || "";
        var notionUrl = item.NotionURL || item.notionURL || item.notionUrl || item.notion_url || "";
        return {
          name: item.名前 || item.name || "",
          status: item.状態 || item.status || "",
          repo: item.リポジトリ || item.repo || "",
          url: url,
          notionUrl: notionUrl,
          href: url || notionUrl || "",
          category: item.カテゴリ || item.category || "",
          description: item.説明 || item.description || "",
          order: typeof item.表示順 === "number" ? item.表示順 :
            (typeof item.order === "number" ? item.order : 999999)
        };
      }).filter(function (app) { return app.repo !== PORTAL_REPO; });
    });
  }

  function loadFromGitHubApi() {
    usedFallback = true;
    return fetch("https://api.github.com/users/" + GH_USER + "/repos?sort=updated&per_page=100")
      .then(function (res) {
        if (!res.ok) throw new Error("GitHub API HTTP " + res.status);
        return res.json();
      })
      .then(function (repos) {
        return repos
          .filter(function (r) { return r.name !== PORTAL_REPO && !r.fork; })
          .map(function (r, i) {
            var url = r.homepage || buildUrlFromRepo(r.name);
            return {
              name: r.name,
              status: "公開中",
              repo: r.name,
              url: url,
              notionUrl: "",
              href: url,
              category: "その他",
              description: r.description || "",
              order: i
            };
          });
      });
  }

  loadAppsJson()
    .catch(function (err) {
      console.warn("apps.json の取得に失敗、GitHub API にフォールバックします:", err);
      return loadFromGitHubApi();
    })
    .then(function (apps) {
      allApps = apps;
      render();
      var formatted = formatUpdated(lastUpdated);
      syncInfoEl.textContent = formatted ? "最終同期: " + formatted : "";
    })
    .catch(function (err) {
      console.error(err);
      mainEl.innerHTML = '<p class="empty">アプリ一覧を取得できませんでした。</p>';
    });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (err) {
        console.warn("Service worker registration failed:", err);
      });
    });
  }
})();
</script>
</body>
</html>
